name: Build TSSSDK Hook DYLIB (Theos)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: بناء DYLIB (arm64)
    runs-on: macos-14

    steps:
      - name: ⬇️ تحميل الكود
        uses: actions/checkout@v4

      - name: 🛠️ إعداد Theos
        run: |
          set -euo pipefail
          echo "🔹 تثبيت Theos..."
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS
          sudo chown $(whoami) $THEOS
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "✅ تم تثبيت Theos"

      - name: 📦 تثبيت SDK
        run: |
          set -euo pipefail
          export THEOS=/opt/theos
          mkdir -p $THEOS/sdks
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          ln -sf "$SDK_PATH" "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk"
          echo "✅ تم ربط SDK: iPhoneOS${SDK_VERSION}.sdk"

      - name: 🔧 تثبيت ldid
        run: |
          brew install ldid

      - name: 🧹 تنظيف
        run: |
          export THEOS=/opt/theos
          make clean || true

      - name: 🔨 بناء DYLIB
        run: |
          export THEOS=/opt/theos
          make package

      - name: ✅ التحقق من المخرجات
        run: |
          set -euo pipefail
          DYLIB_PATH=".theos/obj/debug/arm64/libTSSSDKHook.dylib"
          if [ -f "$DYLIB_PATH" ]; then
            echo "📦 تم البناء بنجاح"
            file "$DYLIB_PATH"
            lipo -info "$DYLIB_PATH"
          else
            echo "❌ الملف غير موجود، البحث عن أي dylib"
            find .theos -name "*.dylib" -type f
            exit 1
          fi

      - name: 📤 رفع dylib
        uses: actions/upload-artifact@v4
        with:
          name: libTSSSDKHook-theos
          path: |
            .theos/obj/debug/arm64/libTSSSDKHook.dylib
            packages/*.deb
          retention-days: 30
